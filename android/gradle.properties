# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

android.useAndroidX=true

# Build all architectures — comment out x86/x86_64 for smaller APK in production
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# React Native New Architecture (Fabric + TurboModules)
newArchEnabled=true

# Hermes JS engine
hermesEnabled=true

# Edge-to-edge display (immersive UI on Android 15+)
edgeToEdgeEnabled=true

# AGP 9.x compatibility
android.builtInKotlin=false
android.newDsl=false

# ─── Java / JDK ────────────────────────────────────────────────────────────────
# Point to JDK 17 (required for React Native 0.87).
# Adjust this path for your machine.
# Windows example: C:\\Work Space\\Mobile_Application\\jdk-17\\jdk-17.0.12+7
# macOS / Linux example: /Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
#
# Uncomment and set the correct path:
# org.gradle.java.home=C:\\Work Space\\Mobile_Application\\jdk-17\\jdk-17.0.12+7
